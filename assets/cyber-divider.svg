<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#fcee0a" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff003c" stop-opacity="0" />
    </linearGradient>
  </defs>
  <line x1="0" y1="12" x2="900" y2="12" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25" />
  <rect x="-200" y="10" width="220" height="4" fill="url(#pulse)">
    <animate attributeName="x" values="-220;900" dur="2.6s" repeatCount="indefinite" />
  </rect>
  <polygon points="410,12 422,4 478,4 490,12 478,20 422,20" fill="#07080f" stroke="#ff003c" stroke-width="1.5" />
  <polygon points="432,12 438,8 462,8 468,12 462,16 438,16" fill="#fcee0a" />
