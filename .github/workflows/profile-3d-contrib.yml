name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Recolor Grey City Floor to Green Wave Gradient
        run: |
          python3 - <<'EOF'
          import re

          path = "profile-3d-contrib/profile-night-green.svg"
          with open(path, "r", encoding="utf-8") as f:
              svg = f.read()

          defs = """<defs>
            <linearGradient id="greenWaveFloor" gradientUnits="userSpaceOnUse" x1="180" y1="220" x2="1120" y2="680">
              <stop offset="0%" stop-color="#0a2e1a"/>
              <stop offset="22%" stop-color="#155e36"/>
              <stop offset="40%" stop-color="#22c55e"/>
              <stop offset="58%" stop-color="#0f3d24"/>
              <stop offset="78%" stop-color="#4ade80"/>
              <stop offset="100%" stop-color="#0a2e1a"/>
            </linearGradient>
          </defs>"""

          svg = re.sub(r"(<svg\b[^>]*>)", r"\1\n" + defs, svg, count=1)

          def recolor_path(match):
              tag = match.group(0)
              def replace_hex(m):
                  prefix, hx = m.group(1), m.group(2)
                  r, g, b = int(hx[0:2], 16), int(hx[2:4], 16), int(hx[4:6], 16)
                  # จับเฉพาะโทนสีเทาของพื้นเมือง (ค่า R, G, B ใกล้เคียงกัน)
                  if max(r, g, b) - min(r, g, b) <= 25 and 15 <= max(r, g, b) <= 210:
                      return f"{prefix}url(#greenWaveFloor)"
                  return m.group(0)
              return re.sub(r'(fill=["\']?|fill:\s*)#([0-9a-fA-F]{6})', replace_hex, tag)

          svg = re.sub(r"<path\b[^>]*>", recolor_path, svg)

          with open(path, "w", encoding="utf-8") as f:
              f.write(svg)
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if ! git diff --staged --quiet; then
            git commit -m "Update 3D contribution graph with green wave floor"
            git push
          fi
