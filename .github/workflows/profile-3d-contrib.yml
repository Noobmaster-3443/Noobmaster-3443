name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply Green Gradient Wave Background
        run: |
          python3 - <<'EOF'
          import re

          path = "profile-3d-contrib/profile-night-green.svg"
          with open(path, "r", encoding="utf-8") as f:
              svg = f.read()

          wave_bg = """<defs>
            <linearGradient id="ppgBg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#06120c"/>
              <stop offset="50%" stop-color="#0f291c"/>
              <stop offset="100%" stop-color="#05100a"/>
            </linearGradient>
            <linearGradient id="ppgWave1" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#4ade80" stop-opacity="0.28"/>
              <stop offset="50%" stop-color="#22c55e" stop-opacity="0.16"/>
              <stop offset="100%" stop-color="#86efac" stop-opacity="0.28"/>
            </linearGradient>
            <linearGradient id="ppgWave2" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#86efac" stop-opacity="0.18"/>
              <stop offset="50%" stop-color="#16a34a" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#4ade80" stop-opacity="0.12"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="100%" height="100%" fill="url(#ppgBg)" rx="16"/>
          <path d="M0,560 C320,440 580,680 920,520 C1080,445 1200,490 1280,460 L1280,850 L0,850 Z" fill="url(#ppgWave1)"/>
          <path d="M0,650 C280,740 620,520 960,640 C1120,695 1210,620 1280,590 L1280,850 L0,850 Z" fill="url(#ppgWave2)"/>
          <path d="M0,560 C320,440 580,680 920,520 C1080,445 1200,490 1280,460" fill="none" stroke="#4ade80" stroke-width="2" stroke-opacity="0.45"/>"""

          svg = re.sub(r"<rect\b[^>]*(?:/>|></rect>)", wave_bg, svg, count=1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(svg)
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if ! git diff --staged --quiet; then
            git commit -m "Update 3D contribution graph with green wave bg"
            git push
          fi
